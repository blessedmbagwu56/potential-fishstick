<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>
      Frontend Mentor | Huddle landing page 
    </title>
   
  </head>
  <body>
    <main>
      <img src="images/logo.svg" alt="logo" class="logo" />
      <div class="content">
        <img src="images/illustration-mockups.svg" alt="bg-desktop" class="mockups"/>
        <section>
          <h1>Build The Community Your Fans Will Love</h1>
          <p>
            Huddle re-imagines the way we build communities. You have a voice,
            but so does your audience. Create connections with your users as you
            engage in genuine discussion.
          </p>
          <button class="btn button" type="button">Register</button>
        </section>

        
        </div>
      </div><div class="social-links">
          <img src="logo-facebook.svg" alt="facebook" type="logo facebook"/>
          <img src="logo-twitter.svg" alt="twitter" type="logo twitter"/>
          <img src="logo-instagram.svg" alt="instagram" type="logo instagram"/>
    </main>
  </body>
</html>
